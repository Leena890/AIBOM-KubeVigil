apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubevigil-webhook
  namespace: default
  labels:
    app: kubevigil-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubevigil-webhook
  template:
    metadata:
      labels:
        app: kubevigil-webhook
    spec:
      containers:
        - name: webhook
          image: kubevigil:v10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: certs-volume
              mountPath: /certs
              readOnly: true
            - name: ledger-volume
              mountPath: /app/evidence
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: certs-volume
          secret:
            secretName: kubevigil-tls
        - name: ledger-volume
          configMap:
            name: kubevigil-ledger
---
apiVersion: v1
kind: Service
metadata:
  name: kubevigil-webhook
  namespace: default
  labels:
    app: kubevigil-webhook
spec:
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: https
  selector:
    app: kubevigil-webhook
